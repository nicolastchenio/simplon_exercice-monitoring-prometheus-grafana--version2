services:
  api:
    build: ./fastapi_app
    container_name: api
    restart: always
    ports:
      - "${FASTAPI_PORT}:8080"
    volumes:
      - ./logs:/logs
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  streamlit:
    build: ./streamlit_app
    container_name: streamlit
    restart: always
    ports:
      - "${STREAMLIT_PORT}:8501"
    environment:
      API_URL: http://api:8080
    volumes:
      - ./logs:/logs
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'

networks:
  app_network:
    driver: bridge

volumes:
  grafana_data:
